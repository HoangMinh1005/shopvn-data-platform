[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopvn-data-platform"
version = "0.1.0"
description = "ShopVN analytics lakehouse project"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
ingestion = ["psycopg[binary]>=3.3,<4"]
monitoring = ["psycopg[binary]>=3.3,<4", "prometheus-client>=0.26,<0.27"]

[project.scripts]
shopvn-extract = "shopvn.ingestion.postgres:main"
shopvn-finance = "shopvn.jobs.direct_finance:main"
shopvn-publish-finance = "shopvn.jobs.publish_finance:main"
shopvn-monitor = "shopvn.monitoring.exporter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shopvn.ingestion" = ["sql/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
