groups:
  - name: shopvn
    rules:
      - alert: ShopVNServiceDown
        expr: shopvn_service_up == 0
        for: 20s
        labels: {severity: critical}
        annotations: {summary: 'Service {{ $labels.service }} is unhealthy'}
      - alert: ShopVNPipelineFailed
        expr: shopvn_pipeline_state{state="failed"} == 1
        for: 10s
        labels: {severity: critical}
        annotations: {summary: 'Latest direct Finance workflow failed; inspect Airflow logs'}
      - alert: ShopVNDailyDeadlineMissed
        expr: shopvn_daily_deadline_missed == 1
        labels: {severity: critical}
        annotations: {summary: 'Scheduled publication missed 08:00 Asia/Ho_Chi_Minh'}
      - alert: ShopVNReconciliationMismatch
        expr: shopvn_fin02_delta_vnd != 0
        labels: {severity: critical}
        annotations: {summary: 'FIN02 candidate differs from source; publication must remain blocked'}
      - alert: ShopVNExporterUnavailable
        expr: up{job="shopvn-pipeline"} == 0
        for: 20s
        labels: {severity: critical}
        annotations: {summary: 'Operational exporter is unavailable'}
      - alert: ShopVNMonitorStale
        expr: time() - shopvn_monitor_last_poll_timestamp_seconds > 60
        labels: {severity: critical}
        annotations: {summary: 'Exporter responds but operational polling is stale'}
      - alert: ShopVNDQGateFailed
        expr: shopvn_pipeline_dq_passed == 0 and on() shopvn_pipeline_state{state="failed"} == 1
        labels: {severity: critical}
        annotations: {summary: 'Failed workflow has not passed its DQ gate'}
      - alert: ShopVNInventoryFailed
        expr: shopvn_inventory_failed == 1
        labels: {severity: critical}
        annotations: {summary: 'Inventory workflow failed; current stock must not be relabelled as missed EOD'}
      - alert: ShopVNInventoryEODMissing
        expr: shopvn_inventory_eod_missing == 1
        labels: {severity: critical}
        annotations: {summary: 'Actual EOD publication missing after 00:10 Vietnam'}
      - alert: ShopVNMarketplaceFailed
        expr: shopvn_marketplace_failed == 1
        labels: {severity: critical}
        annotations: {summary: 'Marketplace workflow failed; inspect candidate/publication gate'}
      - alert: ShopVNMarketplaceIncomplete
        expr: shopvn_marketplace_file_count{state="missing"} + ignoring(state) shopvn_marketplace_file_count{state="rejected"} > 0
        labels: {severity: warning}
        annotations: {summary: 'Marketplace requested scope has missing/rejected files; published totals are partial'}
      - alert: ShopVNMarketplaceReconciliation
        expr: shopvn_marketplace_reconciliation_delta_vnd != 0
        labels: {severity: critical}
        annotations: {summary: 'Marketplace independent source/candidate amount mismatch'}
      - alert: ShopVNMarketplaceDeadline
        expr: shopvn_marketplace_deadline_missed == 1
        labels: {severity: critical}
        annotations: {summary: 'Current D-1 complete scheduled marketplace publication absent by 08:00 Vietnam'}
